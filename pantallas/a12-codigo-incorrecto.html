<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A12 · Código incorrecto · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
<style>
  .digitos.entre { justify-content: space-between; }
  .digitos.entre .digito { border: 2px solid var(--error); border-radius: 18px; }
</style>
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
  <div class="contenido tema-arena" style="overflow: hidden;">
    <div class="encabezado">
      <a class="boton-icono" href="a4-verificar-correo.html" data-volver aria-label="Volver" style="color: #262626"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo">Verificar correo</h1>
      <span class="espacio"></span>
    </div>
    <div class="progreso">
      <p class="progreso__texto" style="height: 24px;">PASO 2 DE 3 · VERIFICACIÓN</p>
      <div class="progreso__barras"><span class="hecho"></span><span class="hecho"></span><span></span></div>
    </div>
    <div class="estado compacto">
      <div class="contenedor-icono c104 cuadrado error"><i class="i">error</i></div>
      <p class="t-t1 c-900">El código no coincide</p>
      <p class="t-cuerpo c-500">Revisa los 6 dígitos del correo o pide uno nuevo.</p>
    </div>
    <div class="digitos entre">
      <label class="digito"><input inputmode="numeric" maxlength="1" value="3" aria-label="Dígito 1"></label>
      <label class="digito"><input inputmode="numeric" maxlength="1" value="8" aria-label="Dígito 2"></label>
      <label class="digito"><input inputmode="numeric" maxlength="1" value="2" aria-label="Dígito 3"></label>
      <label class="digito"><input inputmode="numeric" maxlength="1" value="9" aria-label="Dígito 4"></label>
      <label class="digito"><input inputmode="numeric" maxlength="1" value="1" aria-label="Dígito 5"></label>
      <label class="digito"><input inputmode="numeric" maxlength="1" value="4" aria-label="Dígito 6"></label>
    </div>
    <div class="nota amplia"><i class="i error">warning</i><p>Te quedan 2 intentos antes de bloquear el código.</p></div>
    <div class="enlace"><a href="a4-verificar-correo.html">Reenviar código</a></div>
  </div>
  <div class="barra-accion transparente">
    <a class="boton" href="a4-verificar-correo.html">Volver a intentar</a>
  </div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
