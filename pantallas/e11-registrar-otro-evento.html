<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E11 · Registrar otro evento · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
  <form id="formulario" class="contenido" data-exito="e9-evento-guardado.html" onsubmit="return false" style="overflow: hidden;">
    <div class="encabezado">
      <a class="boton-icono" href="e1-selector-de-tipo-de-evento.html" data-volver aria-label="Volver"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo tema-arena">Registrar evento</h1>
      <span class="espacio"></span>
    </div>
    <div class="carril" style="gap: 8px;">
      <span class="chip activo lavanda"><i class="i">more_horiz</i>Otro</span>
      <a class="chip lavanda" href="e3-consulta-veterinaria.html"><i class="i">stethoscope</i>Consulta</a>
      <a class="chip lavanda" href="e6-peso.html"><i class="i">monitor_weight</i>Peso</a>
    </div>
    <label class="campo">
      <span class="campo__etiqueta">¿Qué pasó?</span>
      <span class="campo__caja"><i class="i">edit</i><input class="ejemplo-900" placeholder="Título del evento" required></span>
    </label>
    <div class="campos" style="width: 100%;">
      <label class="campo"><span class="campo__etiqueta">Fecha</span><span class="campo__caja"><i class="i">event</i><input inputmode="numeric" value="21/09/2026"></span></label>
      <label class="campo"><span class="campo__etiqueta">Lugar</span><span class="campo__caja"><i class="i">place</i><input value="Casa"></span></label>
    </div>
    <label class="campo tema-arena" style="width: 100%; overflow: hidden;">
      <span class="campo__etiqueta" style="height: 24px;">Detalle</span>
      <textarea class="area-texto ejemplo-900" style="height: 56px; padding: 15px 17px; border-color: var(--acento-300);" placeholder="Describe lo que quieres recordar de este evento."></textarea>
    </label>
    <label class="marcador tema-arena" style="width: 100%; height: 96px; cursor: pointer;"><i class="i">add_a_photo</i><span>Foto o video (opcional)</span><input type="file" accept="image/*,video/*" data-ir-tras="e12-revisar-la-foto.html" data-error-archivo="e13-archivo-muy-pesado.html" hidden></label>
  </form>
  <div class="barra-accion transparente">
    <a class="boton" href="e9-evento-guardado.html" data-enviar="formulario">Guardar</a>
  </div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
