<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E8 · Adjuntar soporte · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="contenido">
    <div class="encabezado">
      <span class="boton-icono"><i class="i">close</i></span>
      <h1 class="encabezado__titulo">Registrar evento</h1>
      <span class="espacio"></span>
    </div>
    <div class="campo">
      <span class="campo__etiqueta">Vacuna aplicada *</span>
      <span class="campo__caja"><i class="i">vaccines</i><span class="valor">Antirrábica · Nobivac Rabies</span></span>
    </div>
  </div>
  <a class="velo claro" href="e2-registrar-vacuna.html" data-volver aria-label="Cerrar"></a>
  <div class="hoja" role="dialog" aria-label="Adjuntar soporte" style="top: 445px; bottom: auto;">
    <div class="hoja__asa"></div>
    <p class="t-t2 c-900">Adjuntar soporte</p>
    <div class="lista">
      <label class="fila borde" style="cursor: pointer;">
        <span class="fila__icono"><i class="i">photo_camera</i></span>
        <span class="fila__textos" style="gap: 2px;"><span class="fila__titulo">Tomar foto</span><span class="fila__sub">Carnet, fórmula o examen</span></span>
        <i class="i c-500">chevron_right</i>
        <input type="file" accept="image/*" capture="environment" data-ir-tras="e12-revisar-la-foto.html" data-error-archivo="e13-archivo-muy-pesado.html" hidden>
      </label>
      <label class="fila borde" style="cursor: pointer;">
        <span class="fila__icono"><i class="i">photo_library</i></span>
        <span class="fila__textos"><span class="fila__titulo">Elegir de la galería</span></span>
        <i class="i c-500">chevron_right</i>
        <input type="file" accept="image/*" data-ir-tras="e12-revisar-la-foto.html" data-error-archivo="e13-archivo-muy-pesado.html" hidden>
      </label>
      <label class="fila borde" style="cursor: pointer;">
        <span class="fila__icono"><i class="i">picture_as_pdf</i></span>
        <span class="fila__textos" style="gap: 2px;"><span class="fila__titulo">Subir PDF</span><span class="fila__sub">Hasta 10 MB</span></span>
        <i class="i c-500">chevron_right</i>
        <input type="file" accept="application/pdf" data-ir-tras="e2-registrar-vacuna.html" data-error-archivo="e13-archivo-muy-pesado.html" hidden>
      </label>
    </div>
    <a class="boton secundario" href="e2-registrar-vacuna.html" data-volver>Cancelar</a>
  </div>
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
