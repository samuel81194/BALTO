<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B1 · Datos básicos · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <form id="formulario" class="contenido" data-exito="b2-foto-de-la-mascota.html" onsubmit="return false">
    <div class="encabezado">
      <a class="boton-icono" href="b8-salir-sin-guardar.html" aria-label="Cerrar"><i class="i">close</i></a>
      <h1 class="encabezado__titulo">Nueva mascota</h1>
      <span class="espacio"></span>
    </div>
    <div class="progreso">
      <p class="progreso__texto">PASO 1 DE 4 · DATOS BÁSICOS</p>
      <div class="progreso__barras"><span class="hecho"></span><span></span><span></span><span></span></div>
    </div>
    <div class="selector"><button type="button" class="activo">Perro</button><button type="button">Gato</button></div>
    <label class="campo foco">
      <span class="campo__etiqueta">Nombre</span>
      <span class="campo__caja"><i class="i">pets</i><input value="Luna" required></span>
    </label>
    <label class="campo">
      <span class="campo__etiqueta">Raza</span>
      <span class="campo__caja"><i class="i">search</i><input value="Golden Retriever"></span>
    </label>
    <div class="campos">
      <label class="campo">
        <span class="campo__etiqueta">Sexo</span>
        <span class="campo__caja"><input value="Hembra"></span>
      </label>
      <label class="campo">
        <span class="campo__etiqueta">Nacimiento</span>
        <span class="campo__caja"><input inputmode="numeric" value="12/03/2023"></span>
      </label>
    </div>
    <div class="fila-opcion">
      <p class="fila-opcion__texto">Esterilizada</p>
      <span class="interruptor encendido" role="switch" aria-checked="true" aria-label="Esterilizada"></span>
    </div>
  </form>
  <div class="barra-accion">
    <a class="boton texto-f9" href="b2-foto-de-la-mascota.html" data-enviar="formulario">Siguiente<i class="i">arrow_forward</i></a>
  </div>
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
