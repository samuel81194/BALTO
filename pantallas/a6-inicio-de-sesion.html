<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla" style="--fondo: var(--neutro-0)">

  <form id="formulario" class="contenido" style="top: 358px;" data-exito="inicio.html" data-error="a7-error-de-credenciales.html" onsubmit="return false">

    <label class="campo foco">

      <span class="campo__caja"><i class="i">mail</i><input type="email" value="samuel@correo.com" autocomplete="email" required><i class="i final">check_circle</i></span>

    <label class="campo">
