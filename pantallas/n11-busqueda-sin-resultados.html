<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N11 · Búsqueda sin resultados · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
  <div class="contenido tema-arena">
    <div class="encabezado">
      <a class="boton-icono" href="n2-alimentos.html" data-volver aria-label="Volver" style="color: #262626"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo">Alimentos</h1>
      <span class="espacio"></span>
    </div>
    <form class="buscador" data-buscar="alim|concent|cordero|salm[oó]n|h[uú]medo|snack|dental|perro|gato|cachorro|vacun" data-resultados="n2-alimentos.html" data-sin-resultados="n11-busqueda-sin-resultados.html">
      <label class="campo-busqueda gris"><i class="i">search</i><input type="search" value="alimento crudo barf" enterkeyhint="search" style="padding-bottom: 2px;"></label>
      <span class="boton-icono" style="color: #262626" aria-label="Filtros"><i class="i">tune</i></span>
    </form>
    <div class="carril" style="gap: 8px;">
      <span class="chip activo lavanda" style="color: var(--neutro-0);"><i class="i">pets</i>Perro</span>
      <span class="chip activo lavanda" style="color: var(--neutro-0);"><i class="i">schedule</i>Adulto</span>
    </div>
    <div class="estado compacto">
      <div class="contenedor-icono c104 cuadrado"><i class="i">search_off</i></div>
      <p class="t-t1 c-900">No encontramos eso</p>
      <p class="t-cuerpo c-500">Prueba con otro nombre o quita los filtros.</p>
    </div>
    <div class="enlace"><a href="n2-alimentos.html">Quitar los filtros</a></div>
  </div>
  <div class="barra-accion transparente">
    <a class="boton" href="n2-alimentos.html">Ver todo el alimento</a>
    <a class="boton secundario" href="m8-ayuda.html">Pedir un producto</a>
  </div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
