<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F6 · Editar alergias y condiciones · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
  <form id="formulario" class="contenido" data-exito="f5-alergias-y-condiciones.html" onsubmit="return false" style="overflow: hidden;">
    <div class="encabezado">
      <a class="boton-icono" href="f5-alergias-y-condiciones.html" data-volver aria-label="Volver"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo tema-arena">Editar</h1>
      <span class="espacio"></span>
    </div>
    <label class="campo">
      <span class="campo__etiqueta">Agregar alergia</span>
      <span class="campo__caja"><i class="i">add</i><input class="ejemplo-900" placeholder="Escribe y confirma" enterkeyhint="done" data-chip-en="#alergias"></span>
    </label>
    <div class="carril" id="alergias" style="gap: 8px;">
      <span class="chip activo lavanda"><i class="i" data-quitar=".chip" aria-label="Quitar">close</i>Pollo</span>
      <span class="chip activo lavanda"><i class="i" data-quitar=".chip" aria-label="Quitar">close</i>Pulgas (DAPP)</span>
      <span class="chip lavanda" data-sugerencia="Res"><i class="i">add</i>Sugerido: res</span>
    </div>
    <label class="campo tema-arena" style="width: 100%; overflow: hidden;">
      <span class="campo__etiqueta" style="height: 24px;">Condiciones</span>
      <textarea class="area-texto" style="height: 56px; padding: 15px 17px; border-color: var(--acento-300);">Dermatitis atópica diagnosticada en septiembre de 2026.</textarea>
    </label>
    <label class="campo">
      <span class="campo__etiqueta">Diagnosticada por</span>
      <span class="campo__caja"><i class="i">local_hospital</i><input value="Clínica Veterinaria Norte"></span>
    </label>
    <div class="nota amplia tema-arena"><i class="i">verified</i><p>Guarda solo lo que te confirmó un veterinario.</p></div>
  </form>
  <div class="barra-accion transparente">
    <a class="boton" href="f5-alergias-y-condiciones.html" data-enviar="formulario">Guardar</a>
    <a class="boton secundario" href="f5-alergias-y-condiciones.html" data-volver>Cancelar</a>
  </div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
