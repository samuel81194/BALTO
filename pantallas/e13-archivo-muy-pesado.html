<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E13 · Archivo muy pesado · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
  <div class="contenido tema-arena" style="overflow: hidden;">
    <div class="encabezado">
      <a class="boton-icono" href="e2-registrar-vacuna.html" data-volver aria-label="Volver" style="color: #262626"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo">Adjuntar soporte</h1>
      <span class="espacio"></span>
    </div>
    <div class="estado compacto">
      <div class="contenedor-icono c104 cuadrado error"><i class="i">error</i></div>
      <p class="t-t1 c-900">El archivo pesa más de 10 MB</p>
      <p class="t-cuerpo c-500">No pudimos subir examenes_luna.pdf (18,4 MB).</p>
    </div>
    <div class="nota amplia"><i class="i error">info</i><p>Aceptamos JPG, PNG y PDF de hasta 10 MB.</p></div>
    <div class="lista">
      <label class="fila suave" style="cursor: pointer;">
        <span class="fila__icono"><i class="i">photo_camera</i></span>
        <span class="fila__textos"><span class="fila__titulo">Tomar una foto del documento</span><span class="fila__sub">Suele pesar menos</span></span>
        <i class="i">chevron_right</i>
        <input type="file" accept="image/*" capture="environment" data-ir-tras="e12-revisar-la-foto.html" data-error-archivo="e13-archivo-muy-pesado.html" hidden>
      </label>
      <label class="fila suave" style="cursor: pointer;">
        <span class="fila__icono"><i class="i">folder</i></span>
        <span class="fila__textos"><span class="fila__titulo">Elegir otro archivo</span><span class="fila__sub">Desde la galería o archivos</span></span>
        <i class="i">chevron_right</i>
        <input type="file" accept="image/*,application/pdf" data-ir-tras="e12-revisar-la-foto.html" data-error-archivo="e13-archivo-muy-pesado.html" hidden>
      </label>
    </div>
  </div>
  <div class="barra-accion transparente">
    <label class="boton">Elegir otro archivo<input type="file" accept="image/*,application/pdf" data-ir-tras="e12-revisar-la-foto.html" data-error-archivo="e13-archivo-muy-pesado.html" hidden></label>
    <a class="boton secundario" href="e9-evento-guardado.html">Guardar sin soporte</a>
  </div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
