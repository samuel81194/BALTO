<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C10 · Revisar fórmula detectada · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
  <div class="contenido" style="overflow: hidden;">
    <div class="encabezado">
      <a class="boton-icono" href="c4-subir-formula-o-tratamiento.html" data-volver aria-label="Volver"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo" style="color: #180d08">Revisar fórmula</h1>
      <span class="espacio"></span>
    </div>
    <div class="progreso">
      <p class="progreso__texto" style="height: 24px;">PASO 3 DE 4 · TRATAMIENTOS</p>
      <div class="progreso__barras"><span class="hecho"></span><span class="hecho"></span><span class="hecho"></span><span></span></div>
    </div>
    <label class="campo">
      <span class="campo__etiqueta">Medicamento</span>
      <span class="campo__caja"><i class="i">medication</i><input value="Amoxicilina 250 mg"></span>
    </label>
    <div class="campos">
      <label class="campo">
        <span class="campo__etiqueta">Dosis</span>
        <span class="campo__caja"><i class="i">straighten</i><input value="1 cápsula"></span>
      </label>
      <label class="campo">
        <span class="campo__etiqueta">Cada</span>
        <span class="campo__caja"><i class="i">schedule</i><input value="12 horas"></span>
      </label>
    </div>
    <div class="campos">
      <label class="campo">
        <span class="campo__etiqueta">Desde</span>
        <span class="campo__caja"><i class="i">event</i><input inputmode="numeric" value="21/09/2026"></span>
      </label>
      <label class="campo">
        <span class="campo__etiqueta">Hasta</span>
        <span class="campo__caja"><i class="i">event_busy</i><input inputmode="numeric" value="28/09/2026"></span>
      </label>
    </div>
    <div class="nota amplia tema-arena" style="height: 62px; padding: 1px 16px 14px;"><i class="i">warning</i><p>Confirma la dosis con tu veterinario antes de activar los recordatorios.</p></div>
  </div>
  <div class="barra-accion transparente">
    <a class="boton" href="c5-transcribir-historial-de-chats.html">Confirmar</a>
    <a class="boton secundario" href="c4-subir-formula-o-tratamiento.html">Corregir datos</a>
  </div>
</main>
</div></div>
<script src="../js/app.js"></script>
