<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A9 · Crear contraseña nueva · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <form id="formulario" class="contenido" data-exito="a15-contrasena-actualizada.html" onsubmit="return false">
    <div class="encabezado">
      <a class="boton-icono" href="a14-enlace-enviado.html" data-volver aria-label="Volver"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo">Nueva contraseña</h1>
      <span class="espacio"></span>
    </div>
    <div class="titulos" style="display: flex; flex-direction: column; gap: 6px; overflow: hidden;">
      <p class="t-t1 c-900">Crea tu nueva contraseña</p>
      <p class="t-cuerpo c-500">Usa al menos 8 caracteres, una mayúscula y un número.</p>
    </div>
    <label class="campo foco">
      <span class="campo__etiqueta">Nueva contraseña</span>
      <span class="campo__caja"><i class="i">lock</i><input type="password" value="Baltoperro" autocomplete="new-password" data-requisitos required></span>
    </label>
    <label class="campo">
      <span class="campo__etiqueta">Confirmar contraseña</span>
      <span class="campo__caja"><i class="i">lock</i><input type="password" value="Baltoperro" autocomplete="new-password" required></span>
    </label>
    <div class="cuadricula columna">
      <span class="chip requisito" data-req="largo"><i class="i">check</i>8+ caracteres</span>
      <span class="chip requisito" data-req="mayuscula"><i class="i">check</i>Mayúscula</span>
      <span class="chip requisito" data-req="numero"><i class="i no">close</i>Número</span>
    </div>
  </form>
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
  <a class="boton" href="a15-contrasena-actualizada.html" data-enviar="formulario" style="position: absolute; left: 24px; top: 771px; width: 342px;">Guardar contraseña<i class="i">check</i></a>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
