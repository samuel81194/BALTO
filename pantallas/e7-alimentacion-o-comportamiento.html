<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E7 · Alimentación o comportamiento · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <form id="formulario" class="contenido" data-exito="e9-evento-guardado.html" onsubmit="return false">
    <div class="encabezado">
      <a class="boton-icono" href="e1-selector-de-tipo-de-evento.html" data-volver aria-label="Cerrar"><i class="i">close</i></a>
      <h1 class="encabezado__titulo">Registrar evento</h1>
      <span class="espacio"></span>
    </div>
    <div class="selector" style="width: 100%;">
      <button type="button" class="activo">Alimentación</button>
      <button type="button">Comportamiento</button>
    </div>
    <label class="campo" style="width: 100%; overflow: hidden;">
      <span class="campo__etiqueta">¿Qué cambió?</span>
      <textarea class="area-texto" style="height: 110px;" placeholder="Pasamos de concentrado de cordero a salmón por recomendación de la veterinaria."></textarea>
    </label>
    <label class="campo">
      <span class="campo__etiqueta">Fecha</span>
      <span class="campo__caja"><i class="i">event</i><input inputmode="numeric" value="15/09/2026"></span>
    </label>
    <label class="marcador discontinuo" style="width: 100%; height: 110px; background: rgba(224, 223, 242, 0.6);"><i class="i">add_a_photo</i><span>Foto o video (opcional)</span><input type="file" accept="image/*,video/*" data-ir-tras="e12-revisar-la-foto.html" hidden></label>
  </form>
  <div class="barra-accion">
    <a class="boton texto-f9" href="e9-evento-guardado.html" data-enviar="formulario">Guardar evento<i class="i">check</i></a>
  </div>
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
