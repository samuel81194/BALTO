<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M15 · Confirmar identidad · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
  <form id="formulario" class="contenido tema-arena" data-exito="m16-cuenta-eliminada.html" onsubmit="return false">
    <div class="encabezado">
      <a class="boton-icono" href="m1-ajustes.html" data-volver aria-label="Volver" style="color: #262626"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo">Eliminar cuenta</h1>
      <span class="espacio"></span>
    </div>
    <div class="estado compacto">
      <div class="contenedor-icono c104 cuadrado error"><i class="i">lock_person</i></div>
      <p class="t-t1 c-900">Confirma que eres tú</p>
      <p class="t-cuerpo c-500">Por seguridad, escribe tu contraseña para eliminar la cuenta.</p>
    </div>
    <label class="campo" style="--neutro-900: #262626; --neutro-500: #77737f;">
      <span class="campo__etiqueta">Contraseña</span>
      <span class="campo__caja"><i class="i">lock</i><input type="password" value="balto12345" autocomplete="current-password" required></span>
    </label>
    <div class="nota amplia baja" style="height: 59px;"><i class="i error">download</i><p>Antes de seguir, considera exportar tus datos. Después no hay vuelta atrás.</p></div>
  </form>
  <div class="barra-accion transparente">
    <a class="boton" href="m16-cuenta-eliminada.html" data-enviar="formulario">Eliminar mi cuenta</a>
    <a class="boton secundario" href="m6-exportar-mis-datos.html">Exportar primero</a>
  </div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
