<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B4 · Salud inicial · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="contenido">
    <div class="encabezado">
      <a class="boton-icono" href="b3-identificador.html" data-volver aria-label="Volver"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo">Nueva mascota</h1>
      <span class="espacio"></span>
    </div>
    <div class="progreso">
      <p class="progreso__texto">PASO 4 DE 4 · SALUD INICIAL</p>
      <div class="progreso__barras"><span class="hecho"></span><span class="hecho"></span><span class="hecho"></span><span class="hecho"></span></div>
    </div>
    <label class="campo">
      <span class="campo__etiqueta">Peso actual (kg)</span>
      <span class="campo__caja"><i class="i">monitor_weight</i><input inputmode="decimal" value="28"></span>
    </label>
    <p class="t-micro c-500 nowrap">ALERGIAS CONOCIDAS</p>
    <div class="cuadricula">
      <span class="chip activo" data-alternar>Pollo</span>
      <span class="chip activo" data-alternar>Pulgas (DAPP)</span>
      <span class="chip" data-agregar-chip="¿Qué alergia tiene Luna?"><i class="i">add</i>Agregar</span>
    </div>
    <label class="campo">
      <span class="campo__etiqueta">Condiciones preexistentes</span>
      <span class="campo__caja"><i class="i">healing</i><input value="Ninguna"></span>
    </label>
    <label class="campo">
      <span class="campo__etiqueta">Medicación vigente</span>
      <span class="campo__caja"><i class="i">medication</i><input value="Amoxicilina 250 mg"></span>
    </label>
  </div>
  <div class="barra-accion">
    <a class="boton texto-f9" href="b5-perfil-creado.html">Guardar perfil<i class="i">check</i></a>
  </div>
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
