<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C5 · Transcribir historial de chats · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="contenido">
    <div class="encabezado">
      <a class="boton-icono" href="c4-subir-formula-o-tratamiento.html" data-volver aria-label="Volver"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo">Historial en chats</h1>
      <span class="espacio"></span>
    </div>
    <div class="progreso">
      <p class="progreso__texto">PASO 4 DE 4 · HISTORIAL</p>
      <div class="progreso__barras"><span class="hecho"></span><span class="hecho"></span><span class="hecho"></span><span class="hecho"></span></div>
    </div>
    <label class="campo">
      <span class="campo__etiqueta">Pega o escribe la información</span>
      <textarea class="area-texto" style="height: 130px;" placeholder="&quot;Luna, control 5 sep: dermatitis leve, champú medicado 2 veces por semana…&quot;"></textarea>
    </label>
    <p class="t-micro c-500 nowrap">CLASIFICA ESTE DATO COMO</p>
    <div class="cuadricula" data-grupo>
      <span class="chip activo"><i class="i">stethoscope</i>Consulta</span>
      <span class="chip"><i class="i">vaccines</i>Vacuna</span>
      <span class="chip"><i class="i">labs</i>Examen</span>
      <span class="chip"><i class="i">medication</i>Tratamiento</span>
      <span class="chip"><i class="i">psychology</i>Comportamiento</span>
    </div>
    <label class="campo">
      <span class="campo__etiqueta">Fecha del evento</span>
      <span class="campo__caja"><i class="i">event</i><input inputmode="numeric" value="05/09/2026"></span>
    </label>
  </div>
  <div class="barra-accion">
    <a class="boton texto-f9" href="c11-revisar-eventos-del-historial.html">Agregar a la línea de tiempo<i class="i">add</i></a>
  </div>
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
