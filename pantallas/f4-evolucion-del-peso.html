<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F4 · Evolución del peso · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="contenido">
    <div class="encabezado">
      <a class="boton-icono" href="f1-panel-de-salud.html" data-volver aria-label="Volver"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo">Evolución del peso</h1>
      <span class="espacio"></span>
    </div>
    <div class="selector">
      <button type="button">3 meses</button>
      <button type="button" class="activo">6 meses</button>
      <button type="button">1 año</button>
    </div>
    <div class="grafica">
      <span class="seccion"><span class="t-cuerpo-f c-900">Peso (kg)</span><span class="t-micro c-500">ABR – SEP</span></span>
      <span class="grafica__barras" style="height: 150px;"><span style="height: 50px;"></span><span style="height: 58px;"></span><span style="height: 62px;"></span><span style="height: 66px;"></span><span style="height: 70px;"></span><span class="actual" style="height: 74px;"></span></span>
    </div>
    <div class="cifras sin-borde">
      <div class="cifra primario"><span>28,4</span><span>kg actual</span></div>
      <div class="cifra"><span>+0,3</span><span>vs. agosto</span></div>
    </div>
    <div class="nota"><i class="i">check_circle</i><p>Sin cambios bruscos. Te avisaremos si varía más de 10 % en un mes.</p></div>
  </div>
  <div class="barra-accion">
    <a class="boton texto-f9" href="e6-peso.html">Registrar peso<i class="i">add</i></a>
  </div>
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
