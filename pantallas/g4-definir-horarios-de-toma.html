<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>G4 · Definir horarios de toma · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="contenido">
    <div class="encabezado">
      <a class="boton-icono" href="g3-agregar-medicamento.html" data-volver aria-label="Volver"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo">Horarios de toma</h1>
      <span class="espacio"></span>
    </div>
    <div class="progreso">
      <p class="progreso__texto">PASO 2 DE 2 · HORARIOS</p>
      <div class="progreso__barras"><span class="hecho"></span><span class="hecho"></span></div>
    </div>
    <div class="selector" id="intervalo">
      <button type="button" data-horas="8">Cada 8 h</button>
      <button type="button" class="activo" data-horas="12">Cada 12 h</button>
      <button type="button" data-horas="24">Cada 24 h</button>
    </div>
    <p class="t-micro c-500 nowrap">PRIMERA TOMA DEL DÍA</p>
    <div class="cuadricula" id="primera" data-grupo>
      <span class="chip">06:00</span>
      <span class="chip">07:00</span>
      <span class="chip activo">08:00</span>
      <span class="chip">09:00</span>
      <span class="chip">10:00</span>
    </div>
    <div class="lista" id="tomas">
      <div class="fila borde">
        <span class="fila__icono"><i class="i">wb_sunny</i></span>
        <span class="fila__textos" style="gap: 2px;"><span class="fila__titulo">Toma 1</span><span class="fila__sub">08:00</span></span>
      </div>
      <div class="fila borde">
        <span class="fila__icono"><i class="i">dark_mode</i></span>
        <span class="fila__textos" style="gap: 2px;"><span class="fila__titulo">Toma 2</span><span class="fila__sub">20:00</span></span>
      </div>
    </div>
    <div class="fila borde">
      <span class="fila__icono"><i class="i">notifications_active</i></span>
      <span class="fila__textos" style="gap: 2px;"><span class="fila__titulo">Recordatorio</span><span class="fila__sub">10 min antes de cada toma</span></span>
      <span class="interruptor encendido" role="switch" aria-checked="true" aria-label="Recordatorio"></span>
    </div>
  </div>
  <div class="barra-accion">
    <a class="boton texto-f9" href="g2-detalle-de-tratamiento.html">Guardar horarios<i class="i">check</i></a>
  </div>
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
  <script>
    /* Recalcula las tomas del día según el intervalo y la primera hora elegidos */
    (function () {
      function actualizar() {
        var horas = Number(document.querySelector("#intervalo .activo").getAttribute("data-horas"));
        var inicio = parseInt(document.querySelector("#primera .activo").textContent, 10);
        var lista = document.getElementById("tomas"), html = "";
        for (var i = 0; i < 24 / horas; i++) {
          var h = (inicio + i * horas) % 24;
          var icono = h >= 6 && h < 18 ? "wb_sunny" : "dark_mode";
          html += '<div class="fila borde"><span class="fila__icono"><i class="i">' + icono + '</i></span><span class="fila__textos" style="gap: 2px;"><span class="fila__titulo">Toma ' + (i + 1) + '</span><span class="fila__sub">' + String(h).padStart(2, "0") + ':00</span></span></div>';
        }
        lista.innerHTML = html;
      }
      document.addEventListener("click", function (e) {
        if (e.target.closest("#intervalo > button, #primera > .chip")) setTimeout(actualizar, 0);
      });
    })();
  </script>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
