<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A5 · Datos del dueño · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <form id="formulario" class="contenido" data-exito="a17-prueba-gratis-activada.html" onsubmit="return false">
    <div class="encabezado">
      <a class="boton-icono" href="a4-verificar-correo.html" data-volver aria-label="Volver"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo">Tus datos</h1>
      <span class="espacio"></span>
    </div>
    <div class="progreso">
      <p class="progreso__texto">PASO 3 DE 3 · DATOS DEL DUEÑO</p>
      <div class="progreso__barras"><span class="hecho"></span><span class="hecho"></span><span class="hecho"></span></div>
    </div>
    <label class="campo foco">
      <span class="campo__etiqueta">Nombre completo</span>
      <span class="campo__caja"><i class="i">person</i><input value="Samuel Parada" autocomplete="name" required></span>
    </label>
    <label class="campo">
      <span class="campo__etiqueta">Ciudad</span>
      <span class="campo__caja"><i class="i">location_on</i><input value="Bogotá" autocomplete="address-level2" required></span>
    </label>
    <label class="campo">
      <span class="campo__etiqueta">Teléfono de contacto</span>
      <span class="campo__caja"><i class="i">call</i><input type="tel" value="+57 300 000 0000" autocomplete="tel" required></span>
    </label>
    <div class="nota"><i class="i">info</i><p>Tu teléfono aparece en la vista rápida de tu mascota por si alguien la encuentra.</p></div>
  </form>
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
  <a class="boton" href="a17-prueba-gratis-activada.html" data-enviar="formulario" style="position: absolute; left: 24px; top: 771px; width: 342px;">Empezar prueba gratis<i class="i">arrow_forward</i></a>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
