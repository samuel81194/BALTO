<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A18 · Datos de la tarjeta · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
  <form id="formulario" class="contenido" style="overflow: hidden;" data-exito="a20-pago-aprobado.html" data-error="a21-pago-rechazado.html" onsubmit="return false">
    <div class="encabezado">
      <a class="boton-icono" href="a10-activar-suscripcion.html" data-volver aria-label="Volver"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo" style="color: #180d08">Pagar con tarjeta</h1>
      <span class="espacio"></span>
    </div>
    <label class="campo">
      <span class="campo__etiqueta">Número de tarjeta</span>
      <span class="campo__caja"><i class="i">credit_card</i><input inputmode="numeric" value="0000 0000 0000 0000" autocomplete="cc-number" required></span>
    </label>
    <div class="campos">
      <label class="campo">
        <span class="campo__etiqueta">Vencimiento</span>
        <span class="campo__caja"><i class="i">event</i><input value="MM/AA" autocomplete="cc-exp" required></span>
      </label>
      <label class="campo">
        <span class="campo__etiqueta">CVV</span>
        <span class="campo__caja"><i class="i">lock</i><input type="password" inputmode="numeric" maxlength="4" value="123" autocomplete="cc-csc" required></span>
      </label>
    </div>
    <label class="campo">
      <span class="campo__etiqueta">Nombre en la tarjeta</span>
      <span class="campo__caja"><i class="i">person</i><input value="Samuel Parada" autocomplete="cc-name" required></span>
    </label>
    <div class="nota amplia tema-arena"><i class="i">shield</i><p>Pago seguro. No guardamos el número completo de tu tarjeta.</p></div>
  </form>
  <div class="barra-accion transparente">
    <a class="boton" href="a20-pago-aprobado.html" data-enviar="formulario">Pagar</a>
  </div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
