<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B2 · Foto de la mascota · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="contenido">
    <div class="encabezado">
      <a class="boton-icono" href="b1-datos-basicos.html" data-volver aria-label="Volver"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo">Nueva mascota</h1>
      <span class="espacio"></span>
    </div>
    <div class="progreso">
      <p class="progreso__texto">PASO 2 DE 4 · FOTO</p>
      <div class="progreso__barras"><span class="hecho"></span><span class="hecho"></span><span></span><span></span></div>
    </div>
    <div style="display: flex; justify-content: center; overflow: hidden;">
      <div class="foto-mascota f200" id="foto"><i class="i">pets</i></div>
    </div>
    <p class="t-cuerpo c-500">Una foto clara ayuda a reconocer a Luna en consultas y emergencias.</p>

      <label class="boton suave" style="flex: 1 0 0; min-width: 1px;">Cámara<i class="i">photo_camera</i><input type="file" accept="image/*" capture="environment" data-foto="#foto" hidden></label>
      <label class="boton suave" style="flex: 1 0 0; min-width: 1px;">Galería<i class="i">photo_library</i><input type="file" accept="image/*" data-foto="#foto" hidden></label>
    </div>
    <div class="enlace"><a href="b3-identificador.html" style="color: var(--neutro-500)">Omitir por ahora</a></div>
  </div>
  <div class="barra-accion">
    <a class="boton texto-f9" href="b3-identificador.html">Siguiente<i class="i">arrow_forward</i></a>
  </div>
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
</main>
</div></div>
<script src="../js/app.js"></script>
