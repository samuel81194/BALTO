<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M6 · Exportar mis datos · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="contenido">
    <div class="encabezado">
      <a class="boton-icono" href="m1-ajustes.html" data-volver aria-label="Volver"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo">Exportar mis datos</h1>
      <span class="espacio"></span>
    </div>
    <div class="estado" style="padding-top: 16px;">
      <div class="contenedor-icono c104"><i class="i">download</i></div>
      <p class="t-t1 c-900">Tus datos son tuyos</p>
      <p class="t-cuerpo c-500">Descarga toda la información y los soportes de tus mascotas cuando quieras.</p>
    </div>
    <div class="lista" data-radio>
      <div class="fila seleccionada">
        <span class="fila__icono"><i class="i">pets</i></span>
        <span class="fila__textos"><span class="fila__titulo">Todas las mascotas</span></span>
        <i class="i radio-marca">radio_button_checked</i>
      </div>
      <div class="fila borde">
        <span class="fila__icono"><i class="i">pets</i></span>
        <span class="fila__textos"><span class="fila__titulo">Solo Luna</span></span>
        <i class="i radio-marca">radio_button_unchecked</i>
      </div>
    </div>
    <div class="selector"><button type="button">PDF</button><button type="button" class="activo">ZIP con soportes</button></div>
  </div>
  <div class="barra-accion">
    <a class="boton texto-f9" href="m14-exportacion-lista.html">Descargar<i class="i">download</i></a>
  </div>
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
