<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N13 · Agregar método de pago · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
  <form id="formulario" class="contenido tema-arena" data-exito="n7-entrega-y-pago.html" data-error="n14-pago-rechazado.html" onsubmit="return false">
    <div class="encabezado">
      <a class="boton-icono" href="n7-entrega-y-pago.html" data-volver aria-label="Volver" style="color: #262626"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo">Método de pago</h1>
      <span class="espacio"></span>
    </div>
    <div class="carril" style="gap: 8px;" data-grupo>
      <span class="chip activo lavanda" style="--neutro-900: #262626;"><i class="i">credit_card</i>Tarjeta</span>
      <span class="chip lavanda" style="--neutro-900: #262626;"><i class="i">account_balance</i>PSE</span>
    </div>
    <label class="campo" style="--neutro-900: #262626; --neutro-500: #77737f;">
      <span class="campo__etiqueta">Número de tarjeta</span>
      <span class="campo__caja"><i class="i">credit_card</i><input class="ejemplo-900" inputmode="numeric" placeholder="0000 0000 0000 0000" autocomplete="cc-number" required></span>
    </label>
    <div class="campos" style="--neutro-900: #262626; --neutro-500: #77737f;">
      <label class="campo">
        <span class="campo__etiqueta">Vencimiento</span>
        <span class="campo__caja"><i class="i">event</i><input class="ejemplo-900" placeholder="MM/AA" autocomplete="cc-exp" required></span>
      </label>
      <label class="campo">
        <span class="campo__etiqueta">CVV</span>
        <span class="campo__caja"><i class="i">lock</i><input type="password" inputmode="numeric" maxlength="4" value="123" autocomplete="cc-csc" required></span>
      </label>
    </div>
    <label class="campo" style="--neutro-900: #262626; --neutro-500: #77737f;">
      <span class="campo__etiqueta">Nombre en la tarjeta</span>
      <span class="campo__caja"><i class="i">person</i><input value="Samuel Parada" autocomplete="cc-name" required></span>
    </label>
    <div class="nota amplia baja" style="height: 52px;"><i class="i">shield</i><p>Pago seguro. No guardamos el número completo de tu tarjeta.</p></div>
  </form>
  <div class="barra-accion transparente">
    <a class="boton" href="n7-entrega-y-pago.html" data-enviar="formulario">Guardar y continuar</a>
  </div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
