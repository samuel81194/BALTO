<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O6 · Permiso de cámara · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
  <div class="contenido tema-arena">
    <div class="encabezado">
      <a class="boton-icono" href="e8-adjuntar-soporte.html" data-volver aria-label="Volver" style="color: #262626"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo">Cámara</h1>
      <span class="espacio"></span>
    </div>
    <div class="estado compacto">
      <div class="contenedor-icono c104 cuadrado"><i class="i">photo_camera</i></div>
      <p class="t-t1 c-900">Necesitamos la cámara</p>
      <p class="t-cuerpo c-500">Para tomar fotos del carnet, exámenes y fórmulas de tu mascota.</p>
    </div>
    <div class="nota amplia baja" style="height: 66px; padding-top: 5px; padding-bottom: 18px;"><i class="i">lock</i><p>Solo usamos la cámara cuando tú abres esta pantalla.</p></div>
    <div class="lista" style="gap: 0;">
      <label class="fila suave" style="cursor: pointer;">
        <span class="fila__icono"><i class="i">upload_file</i></span>
        <span class="fila__textos"><span class="fila__titulo">Subir un archivo que ya tengas</span><span class="fila__sub">Sin usar la cámara</span></span>
        <i class="i">chevron_right</i>
        <input type="file" accept="image/*,application/pdf" data-ir-tras="e12-revisar-la-foto.html" data-error-archivo="e13-archivo-muy-pesado.html" hidden>
      </label>
    </div>
  </div>
  <div class="barra-accion transparente">
    <label class="boton">Permitir cámara<input type="file" accept="image/*" capture="environment" data-ir-tras="e12-revisar-la-foto.html" data-error-archivo="e13-archivo-muy-pesado.html" hidden></label>
    <label class="boton secundario">Subir archivo<input type="file" accept="image/*,application/pdf" data-ir-tras="e12-revisar-la-foto.html" data-error-archivo="e13-archivo-muy-pesado.html" hidden></label>
  </div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
