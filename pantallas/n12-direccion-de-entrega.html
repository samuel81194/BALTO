<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N12 · Dirección de entrega · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
  <div class="contenido tema-arena">
    <div class="encabezado">
      <a class="boton-icono" href="n7-entrega-y-pago.html" data-volver aria-label="Volver" style="color: #262626"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo">Dirección de entrega</h1>
      <span class="espacio"></span>
    </div>
    <div class="lista">
      <a class="fila suave" href="n7-entrega-y-pago.html">
        <span class="fila__icono"><i class="i">home</i></span>
        <span class="fila__textos"><span class="fila__titulo">Casa</span><span class="fila__sub">Calle 000 # 00-00, Bogotá</span></span>
        <i class="i">check_circle</i>
      </a>
      <a class="fila suave" href="n7-entrega-y-pago.html">
        <span class="fila__icono"><i class="i">work</i></span>
        <span class="fila__textos"><span class="fila__titulo">Oficina</span><span class="fila__sub">Carrera 00 # 00-00, Bogotá</span></span>
        <i class="i">chevron_right</i>
      </a>
    </div>
    <label class="campo" style="--neutro-900: #262626; --neutro-500: #77737f;">
      <span class="campo__etiqueta">Agregar dirección</span>
      <span class="campo__caja"><i class="i">add_location</i><input class="ejemplo-900" placeholder="Calle, número y barrio" autocomplete="street-address"></span>
    </label>
    <label class="campo" style="--neutro-900: #262626; --neutro-500: #77737f;">
      <span class="campo__etiqueta">Indicaciones</span>
      <span class="campo__caja"><i class="i">sticky_note_2</i><input class="ejemplo-900" placeholder="Torre, apartamento o portería"></span>
    </label>
    <div class="nota amplia baja" style="height: 62px;"><i class="i">local_shipping</i><p>Entregamos en Bogotá de lunes a sábado, entre 8 a. m. y 6 p. m.</p></div>
  </div>
  <div class="barra-accion transparente">
    <a class="boton" href="n7-entrega-y-pago.html">Usar esta dirección</a>
  </div>
</main>
</div></div>
<script src="../js/app.js"></script>

</html>
