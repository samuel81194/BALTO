<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L3 · Reporte enviado · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="contenido">
    <div class="encabezado">
      <span class="espacio"></span>
      <h1 class="encabezado__titulo">Compartir perfil</h1>
      <a class="boton-icono" href="inicio.html" aria-label="Cerrar"><i class="i">close</i></a>
    </div>
    <div class="progreso">
      <p class="progreso__texto">PASO 3 DE 3 · ENVIADO</p>
      <div class="progreso__barras"><span class="hecho"></span><span class="hecho"></span><span class="hecho"></span></div>
    </div>
    <div class="estado" style="padding-top: 20px;">
      <div class="contenedor-icono c104" style="background: var(--primario-900); color: var(--neutro-0);"><i class="i">task_alt</i></div>
      <p class="t-t1 c-900" style="width: 100%;">Reporte listo</p>
      <p class="t-cuerpo c-500" style="width: 100%;">Luna_perfil_salud.pdf · 3 páginas · 420 KB</p>
    </div>
    <div class="fila borde-suave">
      <span class="fila__icono"><i class="i">chat</i></span>
      <span class="fila__textos" style="gap: 2px;"><span class="fila__titulo">Enviado por WhatsApp</span><span class="fila__sub">Hoy, 9:41 a. m.</span></span>
      <i class="i c-500">check_circle</i>
    </div>
    <div class="nota"><i class="i">lock</i><p>Quien lo recibe no necesita cuenta ni la app.</p></div>
  </div>
  <div class="barra-accion">
    <a class="boton texto-f9" href="inicio.html">Listo<i class="i">check</i></a>
  </div>
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
