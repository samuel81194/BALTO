<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A4 · Verificar correo · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <form id="formulario" class="contenido" data-exito="a5-datos-del-dueno.html" data-error="a12-codigo-incorrecto.html" onsubmit="return false">
    <div class="encabezado">
      <a class="boton-icono" href="a3-crear-cuenta.html" data-volver aria-label="Volver"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo">Verificar correo</h1>
      <span class="espacio"></span>
    </div>
    <div class="progreso">
      <p class="progreso__texto">PASO 2 DE 3 · VERIFICACIÓN</p>
      <div class="progreso__barras"><span class="hecho"></span><span class="hecho"></span><span></span></div>
    </div>
    <div class="estado" style="padding-top: 16px;">
      <div class="contenedor-icono c104"><i class="i">mark_email_read</i></div>
      <p class="t-t1 c-900">Revisa tu correo</p>
      <p class="t-cuerpo c-500">Enviamos un código de 6 dígitos a samuel@correo.com</p>
    </div>
    <div class="digitos">
      <label class="digito"><input inputmode="numeric" maxlength="1" value="3" required aria-label="Dígito 1"></label>
      <label class="digito"><input inputmode="numeric" maxlength="1" value="8" required aria-label="Dígito 2"></label>
      <label class="digito"><input inputmode="numeric" maxlength="1" value="2" required aria-label="Dígito 3"></label>
      <label class="digito foco"><input inputmode="numeric" maxlength="1" required aria-label="Dígito 4"></label>
      <label class="digito"><input inputmode="numeric" maxlength="1" required aria-label="Dígito 5"></label>
      <label class="digito"><input inputmode="numeric" maxlength="1" required aria-label="Dígito 6"></label>
    </div>
    <div class="enlace"><span class="c-500" data-cuenta="45" data-plantilla="Reenviar código en {t}" data-listo="Reenviar código" style="color: var(--neutro-500)">Reenviar código en 0:45</span></div>
  </form>
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
  <a class="boton" href="a5-datos-del-dueno.html" data-enviar="formulario" style="position: absolute; left: 24px; top: 771px; width: 342px;">Verificar</a>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
