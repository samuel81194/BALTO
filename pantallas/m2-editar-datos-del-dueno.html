<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M2 · Editar datos del dueño · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <form id="formulario" class="contenido" data-exito="m1-ajustes.html" onsubmit="return false">
    <div class="encabezado">
      <a class="boton-icono" href="m1-ajustes.html" data-volver aria-label="Volver"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo">Mis datos</h1>
      <span class="espacio"></span>
    </div>
    <label class="campo foco">
      <span class="campo__etiqueta">Nombre completo</span>
      <span class="campo__caja"><i class="i">person</i><input value="Samuel Parada" autocomplete="name" required></span>
    </label>
    <label class="campo">
      <span class="campo__etiqueta">Correo</span>
      <span class="campo__caja"><i class="i">mail</i><input type="email" value="samuel@correo.com" autocomplete="email" required></span>
    </label>
    <label class="campo">
      <span class="campo__etiqueta">Ciudad</span>
      <span class="campo__caja"><i class="i">location_on</i><input value="Bogotá"></span>
    </label>
    <label class="campo">
      <span class="campo__etiqueta">Teléfono</span>
      <span class="campo__caja"><i class="i">call</i><input type="tel" value="+57 300 000 0000" autocomplete="tel"></span>
    </label>
    <div class="nota"><i class="i">info</i><p>El teléfono aparece en la vista rápida y en los reportes PDF.</p></div>
  </form>
  <div class="barra-accion">
    <a class="boton" href="m1-ajustes.html" data-enviar="formulario">Guardar cambios<i class="i">check</i></a>
  </div>
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
