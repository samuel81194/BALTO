<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>M3 · Configurar notificaciones · Balto</title>
<link rel="stylesheet" href="../css/balto.css">
</head>
<body>
<div class="escenario"><div class="dispositivo">
<main class="pantalla">
  <div class="contenido">
    <div class="encabezado">
      <a class="boton-icono" href="m1-ajustes.html" data-volver aria-label="Volver"><i class="i">arrow_back</i></a>
      <h1 class="encabezado__titulo">Notificaciones</h1>
      <span class="espacio"></span>
    </div>
    <div class="lista">
      <div class="fila borde">
        <span class="fila__icono"><i class="i">vaccines</i></span>
        <span class="fila__textos" style="gap: 2px;"><span class="fila__titulo">Vacunas y desparasitaciones</span><span class="fila__sub">7 días antes</span></span>
        <span class="interruptor encendido" role="switch" aria-checked="true" aria-label="Vacunas y desparasitaciones"></span>
      </div>
      <div class="fila borde">
        <span class="fila__icono"><i class="i">medication</i></span>
        <span class="fila__textos" style="gap: 2px;"><span class="fila__titulo">Tomas de medicamentos</span><span class="fila__sub">10 min antes</span></span>
        <span class="interruptor encendido" role="switch" aria-checked="true" aria-label="Tomas de medicamentos"></span>
      </div>
      <div class="fila borde">
        <span class="fila__icono"><i class="i">restaurant</i></span>
        <span class="fila__textos"><span class="fila__titulo">Comidas</span></span>
        <span class="interruptor" role="switch" aria-checked="false" aria-label="Comidas"></span>
      </div>
      <div class="fila borde">
        <span class="fila__icono"><i class="i">event</i></span>
        <span class="fila__textos" style="gap: 2px;"><span class="fila__titulo">Citas</span><span class="fila__sub">1 día antes</span></span>
        <span class="interruptor encendido" role="switch" aria-checked="true" aria-label="Citas"></span>
      </div>
      <div class="fila borde">
        <span class="fila__icono"><i class="i">local_shipping</i></span>
        <span class="fila__textos"><span class="fila__titulo">Pedidos de la tienda</span></span>
        <span class="interruptor encendido" role="switch" aria-checked="true" aria-label="Pedidos de la tienda"></span>
      </div>
    </div>
    <p class="t-micro c-500 nowrap">NO MOLESTAR</p>
    <div class="campos">
      <label class="campo">
        <span class="campo__etiqueta">Desde</span>
        <span class="campo__caja"><i class="i">bedtime</i><input inputmode="numeric" value="22:00"></span>
      </label>
      <label class="campo">
        <span class="campo__etiqueta">Hasta</span>
        <span class="campo__caja"><i class="i">wb_sunny</i><input inputmode="numeric" value="07:00"></span>
      </label>
    </div>
  </div>
  <div class="barra-estado"><span class="hora">9:41</span><span class="indicadores"><i class="i">signal_cellular_alt</i><i class="i">wifi</i><i class="i">battery_full</i></span></div>
</main>
</div></div>
<script src="../js/app.js"></script>
</body>
</html>
